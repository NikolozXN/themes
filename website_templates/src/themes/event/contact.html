<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Conf - Contact</title>
    <link rel="stylesheet" href="/dist/css/style.css">
    <style>
        .dark-mode { display: none; }
        .dark .dark-mode { display: block; }
        .dark .light-mode { display: none; }
    </style>
</head>
<body class="bg-black dark:bg-black text-white dark:text-white font-sans antialiased transition-colors duration-200">
    
    <nav class="fixed w-full z-50 bg-black/80 dark:bg-black/80 backdrop-blur-md border-b border-white/10 dark:border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 dark:from-purple-400 dark:to-pink-600">NEXTGEN.</a>
            <div class="hidden md:flex items-center space-x-4">
                <div class="flex space-x-8 text-sm font-bold uppercase tracking-widest text-gray-400 dark:text-gray-400">
                    <a href="index.html" class="hover:text-white dark:hover:text-white transition">Home</a>
                    <a href="about.html" class="hover:text-white dark:hover:text-white transition">About</a>
                    <a href="services.html" class="hover:text-white dark:hover:text-white transition">Schedule</a>
                    <a href="contact.html" class="text-white dark:text-white">Contact</a>
                </div>
                <button id="dark-mode-toggle" class="p-2 text-gray-400 dark:text-gray-400 hover:text-white dark:hover:text-white hover:bg-white/10 dark:hover:bg-white/10 rounded-lg transition ml-4">
                    <svg class="w-5 h-5 light-mode" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 dark-mode" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                <a href="contact.html" class="bg-white dark:bg-white text-black dark:text-black px-6 py-2 rounded-full font-bold text-sm uppercase tracking-widest hover:bg-gray-200 dark:hover:bg-gray-200 transition ml-4">Get Tickets</a>
            </div>
            <div class="md:hidden flex items-center gap-2">
                <button id="dark-mode-toggle" class="p-2 text-gray-400 dark:text-gray-400 hover:text-white dark:hover:text-white hover:bg-white/10 dark:hover:bg-white/10 rounded-lg transition">
                    <svg class="w-5 h-5 light-mode" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 dark-mode" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                <button id="mobile-menu-btn" class="p-2 text-gray-400 dark:text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-black/95 dark:bg-black/95 border-t border-white/10 dark:border-white/10 pb-4">
            <div class="container mx-auto px-6 py-4 flex flex-col gap-3">
                <a href="index.html" class="text-gray-400 dark:text-gray-400 hover:text-white dark:hover:text-white transition text-sm uppercase tracking-widest">Home</a>
                <a href="about.html" class="text-gray-400 dark:text-gray-400 hover:text-white dark:hover:text-white transition text-sm uppercase tracking-widest">About</a>
                <a href="services.html" class="text-gray-400 dark:text-gray-400 hover:text-white dark:hover:text-white transition text-sm uppercase tracking-widest">Schedule</a>
                <a href="contact.html" class="text-white dark:text-white font-bold text-sm uppercase tracking-widest">Contact</a>
                <a href="contact.html" class="bg-white dark:bg-white text-black dark:text-black px-6 py-2 rounded-full font-bold text-sm uppercase tracking-widest hover:bg-gray-200 dark:hover:bg-gray-200 transition text-center mt-2">Get Tickets</a>
            </div>
        </div>
    </nav>

    <main class="min-h-screen flex items-center justify-center pt-20 pb-20 container mx-auto px-6">
        <div class="max-w-xl w-full">
            <h1 class="text-5xl font-black mb-8 text-center text-white dark:text-white">Get Your Ticket</h1>
            <p class="text-gray-500 dark:text-gray-500 text-center mb-12">Join us for the most exciting tech event of the year.</p>

            <form class="space-y-6">
                <div>
                    <label class="block text-gray-500 dark:text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" class="w-full bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 rounded-lg px-4 py-3 text-white dark:text-white focus:border-pink-500 dark:focus:border-pink-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-gray-500 dark:text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" class="w-full bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 rounded-lg px-4 py-3 text-white dark:text-white focus:border-pink-500 dark:focus:border-pink-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-gray-500 dark:text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Ticket Type</label>
                    <select class="w-full bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 rounded-lg px-4 py-3 text-white dark:text-white focus:border-pink-500 dark:focus:border-pink-500 focus:outline-none transition">
                        <option class="bg-black dark:bg-black">General Admission ($299)</option>
                        <option class="bg-black dark:bg-black">VIP Pass ($599)</option>
                        <option class="bg-black dark:bg-black">Student Pass ($99)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 dark:from-purple-500 dark:to-pink-500 text-white font-bold py-4 rounded-lg hover:shadow-[0_0_20px_rgba(236,72,153,0.4)] transition">Complete Registration</button>
            </form>
        </div>
    </main>

    <footer class="py-12 border-t border-white/10 dark:border-white/10 text-center text-gray-500 dark:text-gray-500 text-sm">
        &copy; 2026 NextGen Conference. <a href="../../index.html" class="text-white dark:text-white ml-2 hover:text-pink-500 dark:hover:text-pink-500 transition">Back to Themes</a>
    </footer>

    <script>
        // Mobile Menu Toggle
        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const html = document.documentElement;
        
        // Check for saved theme preference or default to dark mode (event theme is dark by default)
        const currentTheme = localStorage.getItem('event-theme') || 'dark';
        if (currentTheme === 'dark') {
            html.classList.add('dark');
        }
        
        darkModeToggle?.addEventListener('click', () => {
            html.classList.toggle('dark');
            const theme = html.classList.contains('dark') ? 'dark' : 'light';
            localStorage.setItem('event-theme', theme);
        });
    </script>
</body>
</html>
