<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Conf - Contact</title>
    <link rel="stylesheet" href="/dist/css/style.css">
</head>
<body class="bg-black text-white font-sans antialiased">
    
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">NEXTGEN.</a>
            <div class="hidden md:flex space-x-8 text-sm font-bold uppercase tracking-widest text-gray-400">
                <a href="index.html" class="hover:text-white transition">Home</a>
                <a href="about.html" class="hover:text-white transition">About</a>
                <a href="services.html" class="hover:text-white transition">Schedule</a>
                <a href="contact.html" class="text-white">Contact</a>
            </div>
            <a href="contact.html" class="bg-white text-black px-6 py-2 rounded-full font-bold text-sm uppercase tracking-widest hover:bg-gray-200 transition">Get Tickets</a>
        </div>
    </nav>

    <main class="min-h-screen flex items-center justify-center pt-20 pb-20 container mx-auto px-6">
        <div class="max-w-xl w-full">
            <h1 class="text-5xl font-black mb-8 text-center">Get Your Ticket</h1>
            <p class="text-gray-500 text-center mb-12">Join us for the most exciting tech event of the year.</p>

            <form class="space-y-6">
                <div>
                    <label class="block text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:border-pink-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:border-pink-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Ticket Type</label>
                    <select class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:border-pink-500 focus:outline-none transition">
                        <option class="bg-black">General Admission ($299)</option>
                        <option class="bg-black">VIP Pass ($599)</option>
                        <option class="bg-black">Student Pass ($99)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-lg hover:shadow-[0_0_20px_rgba(236,72,153,0.4)] transition">Complete Registration</button>
            </form>
        </div>
    </main>

    <footer class="py-12 border-t border-white/10 text-center text-gray-500 text-sm">
        &copy; 2026 NextGen Conference. <a href="../../index.html" class="text-white ml-2 hover:text-pink-500 transition">Back to Themes</a>
    </footer>
</body>
</html>
